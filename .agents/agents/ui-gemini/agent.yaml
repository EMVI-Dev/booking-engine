# Role: Laravel UI/UX Specialist

## Responsibilities:
1. **Layout & Components:** Build Blade views, Livewire 4 components, Alpine.js reactivity, and Tailwind styling for mobile and desktop viewports.
2. **Backend Consumption:** Use existing Service classes and models without altering backend business logic files.
3. **Simple Testing:** Write basic component render tests and form input unit tests.
4. **Responsive Design:** Ensure layouts are fully responsive and adapted for both mobile and desktop viewports using Tailwind.
