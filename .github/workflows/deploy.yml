name: deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare SSH
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${LIGHTSAIL_HOST:-}" ]; then
            echo "LIGHTSAIL_HOST secret is empty."
            exit 1
          fi
          if [ -z "${LIGHTSAIL_SSH_KEY:-}" ]; then
            echo "LIGHTSAIL_SSH_KEY secret is empty."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null; then
            echo "LIGHTSAIL_SSH_KEY is not a usable private key."
            echo "Paste the private key (BEGIN OPENSSH PRIVATE KEY), not the .pub file."
            exit 1
          fi
          echo "Private key parsed. Fetching host keys for ${LIGHTSAIL_HOST}"
          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts

      - name: Confirm SSH login
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          set -euo pipefail
          if [ -z "${LIGHTSAIL_USER:-}" ]; then
            echo "LIGHTSAIL_USER secret is empty."
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}" \
            'echo LOGIN_OK && whoami && hostname'

      - name: Pull code and refresh Laravel
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}" \
            env DEPLOY_SHA="$DEPLOY_SHA" bash -s <<'REMOTE'
          set -euo pipefail
          cd /var/www/travelengine
          echo "connected $(hostname) as $(whoami)"
          echo "deploying ${DEPLOY_SHA}"
          echo "origin=$(git remote get-url origin)"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          git remote set-url origin git@github.com:EMVI-Dev/booking-engine.git
          git fetch origin
          git reset --hard "$DEPLOY_SHA"
          composer install --no-dev --optimize-autoloader --no-interaction
          php artisan migrate --force --no-interaction
          php artisan optimize
          php artisan storage:link --no-interaction || true
          sudo chown -R ubuntu:www-data storage bootstrap/cache
          sudo chmod -R ug+rwx storage bootstrap/cache
          REMOTE

      - name: Upload Vite build
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -r \
            public/build "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}:/var/www/travelengine/public/"

      - name: Restart queue workers
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}" bash <<'REMOTE'
          set -euo pipefail
          sudo chown -R ubuntu:www-data /var/www/travelengine/public/build
          sudo supervisorctl restart travelengine-worker:* travelengine-scheduler
          sudo supervisorctl status
          REMOTE

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *TravelEngine* deploy ${{ job.status }} — `${{ github.sha }}` by ${{ github.actor }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
