name: deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'emvidev/booking-engine'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Pull code and refresh Laravel
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/travelengine
            git fetch --all --prune
            git reset --hard "${{ github.sha }}"
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force --no-interaction
            php artisan optimize
            php artisan storage:link --no-interaction || true
            sudo chown -R ubuntu:www-data storage bootstrap/cache
            sudo chmod -R ug+rwx storage bootstrap/cache

      - name: Upload Vite build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: public/build
          target: /var/www/travelengine/public

      - name: Restart queue workers
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            sudo chown -R ubuntu:www-data /var/www/travelengine/public/build
            sudo supervisorctl restart travelengine-worker:* travelengine-scheduler
            sudo supervisorctl status

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *TravelEngine* deploy ${{ job.status }} — `${{ github.sha }}` by ${{ github.actor }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
